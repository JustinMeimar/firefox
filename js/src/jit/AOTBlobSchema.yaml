# [SMDOC] AOT Blob Schema
# =======================
# Parsed by GenerateAOTBlobFiles.py at build time to produce
# jit/AOTBlobGenerated.h. Single source of truth for AOT blob layout:
# the fixed-size POD (`fields`), variable-size element arrays (`arrays`),
# and the Encode/Decode helpers all fall out of this schema.
#
# `fields` vs `arrays`:
#   - `fields` is a fixed-size, trivially-copyable POD read first at
#     decode time. It carries scalars including the counts that size
#     each array.
#   - `arrays` are variable-length sequences appended after the fields
#     POD. Each array's element count comes from a field named by
#     `count_from`.
#
# Field types:
#   u8  / u16 / u32   -> uint8_t / uint16_t / uint32_t
#   raw               -> pass-through C++ type, size must be given
#
# Array descriptor:
#   name        - field name on AOTPayload_<Kind>
#   element     - C++ type of each element (must be trivially copyable)
#   count_from  - `fields` member that stores the array length
#
# Scope: this schema describes layout only. C++-side population of a
# payload from live VM objects is *not* schematised; it belongs in C++.
# Do not add fields here that embed C++ expressions.
#
# Bump AOT_CONTAINER_VERSION in AOT.h for any wire-format change:
# adding a blob kind, adding/reordering/resizing a field in an existing
# blob, changing a field type, adding an array, or renaming an array's
# count_from. When the version isn't bumped, the build fails at the
# fieldsSize check on the next load.
#
# Container magic, version, and fingerprint layout live in
# jit/AOT.h and jit/AOTContainerWriter. Not duplicated here.

structs:
  AOTCodegenOptions:
    doc: "Codegen-relevant JitOptions snapshot. Grows with each new field BaselineCodeGen reads."
    fields:
      - {name: disableInlining,              type: u8}
      - {name: spectreObjectMitigations,     type: u8}
      - {name: spectreStringMitigations,     type: u8}
      - {name: baselineBatching,             type: u8}
      - {name: baselineJitWarmUpThreshold,   type: u32}
      - {name: baselineQueueCapacity,        type: u32}
      - {name: trialInliningWarmUpThreshold, type: u32}
      - {name: reserved,                     type: u32}

blobs:
  BaselineInterpreter:
    kind_id: 0
    doc: "Singleton baseline interpreter blob."
    fields:
      - {name: InterpretOp,               type: u32}
      - {name: InterpretOpNoDebugTrap,    type: u32}
      - {name: BailoutPrologue,           type: u32}
      - {name: ProfilerEnterToggle,       type: u32}
      - {name: ProfilerExitToggle,        type: u32}
      - {name: DebugTrapHandler,          type: u32}
      - {name: CallVMDebugPrologue,       type: u32}
      - {name: CallVMDebugEpilogue,       type: u32}
      - {name: CallVMDebugAfterYield,     type: u32}
      - {name: DebugInstrumentationCount, type: u32}
      - {name: DebugTrapCount,            type: u32}
      - {name: CodeCoverageCount,         type: u32}
      - {name: ICReturnCount,             type: u32}
    arrays:
      - {name: debugInstr, element: "uint32_t", count_from: DebugInstrumentationCount}
      - {name: debugTraps, element: "uint32_t", count_from: DebugTrapCount}
      - {name: coverage,   element: "uint32_t", count_from: CodeCoverageCount}
      - {name: icReturns,  element: "js::jit::BaselineInterpreter::ICReturnOffset",
                           count_from: ICReturnCount}

  InlineCacheStub:
    kind_id: 1
    doc: "Per-hint AOT CacheIR stub code."
    fields:
      - {name: kind,              type: raw, cpp_type: "js::jit::CacheKind", size: 1}
      - {name: makesGCCalls,      type: u8}
      - {name: stubDataOffset,    type: u8}
      - {name: localTracingSlots, type: u8}
      - {name: pad,               type: u8}
      - {name: cacheIRCodeLength, type: u32}
      - {name: numStubFields,     type: u32}
    arrays:
      - {name: cacheIRCode, element: "uint8_t", count_from: cacheIRCodeLength}
      - {name: fieldTypes,  element: "uint8_t", count_from: numStubFields}

  BaselineFunction:
    kind_id: 2
    doc: |
      Per-script AOT baseline code. Covers both self-hosted builtins and
      guest scripts; identity is by canonical byte content, not by the
      script's origin.
    fields:
      - {name: warmUpCheckPrologueOffset, type: u32}
      - {name: profilerEnterToggleOffset, type: u32}
      - {name: profilerExitToggleOffset,  type: u32}
      - {name: retAddrEntryCount,         type: u32}
      - {name: osrEntryCount,             type: u32}
      - {name: debugTrapEntryCount,       type: u32}
      - {name: resumeEntryCount,          type: u32}
      - {name: codeSize,                  type: u32}
      - {name: headerSize,                type: u32}
      - {name: canonicalSize,             type: u32}
      - {name: nargs,                     type: u16}
      - {name: nfixed,                    type: u16}
      - {name: scopeKind,                 type: u8}
      # scopeKind (u8) + pad0 (u8) + pad1 (u16) = 4 bytes, aligning the
      # trailing array section to a 4-byte boundary. Hand-counted; adjust
      # when adding fields above.
      - {name: pad0,                      type: u8}
      - {name: pad1,                      type: u16}
    arrays:
      - {name: retAddrs,      element: "js::jit::RetAddrEntry",
                              count_from: retAddrEntryCount}
      - {name: osrEntries,    element: "js::jit::BaselineScript::OSREntry",
                              count_from: osrEntryCount}
      - {name: debugTraps,    element: "js::jit::BaselineScript::DebugTrapEntry",
                              count_from: debugTrapEntryCount}
      - {name: resumeOffsets, element: "uint32_t",
                              count_from: resumeEntryCount}
      - {name: canonical,     element: "uint8_t",
                              count_from: canonicalSize}
